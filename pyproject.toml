[project]
name = "run"
version = "0.1.0"
description = "A configurable runner for compilation, execution, and cleanup."
authors = [
    { name = "kuranne" }
]
dependencies = []

[project.scripts]
run = "main:main"
run-cli = "main:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

