# Auto Compiler & Runner Configuration (Run.toml)

[core]
# Global settings
# exclude_files = ["test_private.cpp", "benchmark.cpp"]
# exclude_extensions = [".md", ".txt"]

[runners]
# Override default compilers and/or interpreters
# c = "clang"
# cpp = "clang++"
# rust = "rustc"

[presets.debug]
# Compile flags for debug preset
# c = ["-g", "-Wall", "-Wextra"]
# cpp = ["-g", "-Wall", "-Wextra", "-std=c++20"]
# rust = ["-g"]

[presets.release]
# Compile flags for release preset
# c = ["-O3"]
# cpp = ["-O3", "-std=c++20"]
# rust = ["-C", "opt-level=3"]

# Custom language support (Array of Tables)
# [[languages]]
# name = "csharp"
# extensions = [".cs"]
# runner = "dotnet"
# subcommand = "run"
# type = "interpreter"              # "interpreter" (run directly) or "compiler" (compile then run)
# flags = ["<flags>"]               # Example compile-time flags
# arguments = ["<argument>"]

# Replace default language support
