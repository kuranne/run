# ==============================================================================
# Auto Compiler & Runner Configuration (Run.toml)
#
# Config search priority:
# 1. Project directory (current working directory up to 4 parent levels)
# 2. Global directory:
#    - Linux / macOS: ~/.config/run_kuranne/Run.toml ($XDG_CONFIG_HOME)
#    - Windows: %APPDATA%\run_kuranne\Run.toml
# ==============================================================================

# ------------------------------------------------------------------------------
# [core]
# Global file discovery and filtering settings applied across all runners.
# ------------------------------------------------------------------------------
[core]
# exclude_files (List[str]): Specific file names to skip when compiling or scanning with -L / -m.
# exclude_files = ["test_private.cpp", "benchmark.cpp", "temp.c"]

# exclude_extensions (List[str]): File extensions to skip during directory scans.
# Note: '.toml' and '.lock' are excluded by default.
# exclude_extensions = [".md", ".txt", ".json", ".yaml", ".bak"]

# ------------------------------------------------------------------------------
# [tasks]
# Custom command shortcuts and aliases (e.g., 'run test', 'run build').
# Extra CLI arguments after the task name are forwarded to the task command.
# ------------------------------------------------------------------------------
[tasks]
# test = "pytest tests/ -v"
# bench = "cargo bench"
# build = "cmake -B build && cmake --build build"
# clean = "rm -rf build target .run_cache"

# ------------------------------------------------------------------------------
# [projects.<name>]
# Generic project manifest detectors. When 'run' is invoked without arguments,
# it automatically scans for these manifest files and runs the project.
# Built-in defaults: cargo (Cargo.toml), go (go.mod), zig (build.zig), cmake (CMakeLists.txt), make (Makefile).
# ------------------------------------------------------------------------------

# Example 1: CMake project runner (build then run)
# [projects.cmake]
# file = "CMakeLists.txt"
# build = "cmake -B build && cmake --build build"
# run = "./build/app"

# Example 2: Gradle project runner
# [projects.gradle]
# file = "build.gradle"
# command = "./gradlew run"

# Example 3: Node.js / NPM project runner
# [projects.node]
# file = "package.json"
# command = "npm start"

# ------------------------------------------------------------------------------
# [runners]
# Override default compiler or interpreter binary used for built-in languages.
# Default binaries:
# - c: "gcc"
# - cpp: "g++"
# - rust: "rustc"
# - java: "javac"
# - python: "python" / "python3" (or active virtual environment)
# ------------------------------------------------------------------------------
[runners]
# c = "clang"
# cpp = "clang++"
# rust = "rustc"
# java = "javac"
# python = "python3"

# ------------------------------------------------------------------------------
# [presets.<name>]
# Define reusable build flag presets activated via CLI flag: -p <name> / --preset <name>.
# Each preset maps a language name to a list of compiler/interpreter flags.
# ------------------------------------------------------------------------------

# Debug build preset (run <file> -p debug)
[presets.debug]
# c = ["-g", "-Wall", "-Wextra", "-O0"]
# cpp = ["-g", "-Wall", "-Wextra", "-std=c++20", "-O0"]
# rust = ["-g"]
# java = ["-g"]

# Release build preset (run <file> -p release)
[presets.release]
# c = ["-O3", "-march=native", "-DNDEBUG"]
# cpp = ["-O3", "-std=c++20", "-march=native", "-DNDEBUG"]
# rust = ["-C", "opt-level=3"]
# java = ["-O"]

# Strict checking preset (run <file> -p strict)
[presets.strict]
# c = ["-Wall", "-Wextra", "-Wpedantic", "-Werror"]
# cpp = ["-Wall", "-Wextra", "-Wpedantic", "-Werror", "-std=c++20"]

# ------------------------------------------------------------------------------
# [[languages]]
# Array of Tables for adding new language support or replacing built-in behavior.
#
# Available fields:
# - name (str, required): Unique language name (used for preset matching).
# - extensions (List[str], required): File extensions mapped to this language.
# - runner (str, required): Executable command or compiler/interpreter path.
# - subcommand (str, optional): Subcommand passed before flags (e.g., 'run', 'cc').
# - type (str, optional): 'interpreter' (run directly) or 'compiler' (compile then execute). Default: 'interpreter'.
# - flags (List[str], optional): Flags appended during compilation or execution.
# - arguments (List[str], optional): Arguments passed to the target program when executed.
# ------------------------------------------------------------------------------

# Example 1: Interpreted custom language (e.g., C# with dotnet script or dotnet run)
# [[languages]]
# name = "csharp"
# extensions = [".cs"]
# runner = "dotnet"
# subcommand = "run"
# type = "interpreter"
# flags = ["--project"]
# arguments = []

# Example 2: Compiled custom language (e.g., Kotlin with kotlinc)
# [[languages]]
# name = "kotlin"
# extensions = [".kt"]
# runner = "kotlinc"
# type = "compiler"
# flags = ["-include-runtime"]
# arguments = []

# Example 3: Override built-in C compiler with Zig cc
# [[languages]]
# name = "c"
# extensions = [".c"]
# runner = "zig"
# subcommand = "cc"
# type = "compiler"
# flags = ["-Wall", "-Wextra", "-O2"]
# arguments = []