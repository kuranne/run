name: Rust & CLI Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-docs:
    name: Rust Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Rust Unit Tests
        run: cargo test
      - name: Build Release Binary
        run: cargo build --release
      - name: Black-Box CLI Pytest Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            PYTHONPATH=".;tests" RUN_BIN="$PWD/target/release/run.exe" pytest -p no:cacheprovider tests/
          else
            PYTHONPATH=".:tests" RUN_BIN="$PWD/target/release/run" pytest -p no:cacheprovider tests/
          fi
