name: Rust & CLI Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-docs:
    name: Rust Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Rust Workspace Unit & Integration Tests
        run: cargo test --workspace
      - name: Build Release Binary
        run: cargo build --release
      - name: Black-Box CLI Pytest Suite (Unix)
        if: runner.os != 'Windows'
        run: pytest -p no:cacheprovider -o pythonpath=". tests" tests/
      - name: Black-Box CLI Pytest Suite (Windows)
        if: runner.os == 'Windows'
        run: python tests/run_unelevated.py -m pytest -p no:cacheprovider -o pythonpath=". tests" tests/
