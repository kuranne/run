name: Chore Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chore:
    name: Chore & Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Makefile targets
        run: make -n build release test lint doc completions install uninstall clean >/dev/null
      - name: Validate TOML files
        run: |
          python3 - <<'EOF'
          import pathlib, tomllib
          for name in ("Cargo.toml", "xtask/Cargo.toml", ".cargo/config.toml", "Run.toml"):
              p = pathlib.Path(name)
              if p.is_file():
                  tomllib.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {name}")
          EOF
